# Template. Copy to secrets.yml, fill in, and never commit the copy.
#
#   cp secrets.example.yml secrets.yml
#
# secrets.yml is gitignored and imported by application.yml at startup. Anything set here can
# equally be supplied as an environment variable, which is what a deployment should do.
auth:
  # Who gets the operations console, comma-separated. Empty means nobody does. Kept here rather
  # than in application.yml so a real address is never committed.
  admin-emails: ""

  # Password used to create an allowlisted admin account that does not exist yet. Must satisfy
  # PasswordPolicy: 8+ characters with at least one letter and one number.
  admin-password: ""

spring:
  mail:
    # The mailbox reset codes are sent from.
    username: ""
    # For Gmail this is a 16-character App Password from myaccount.google.com/apppasswords,
    # NOT the account password — Google stopped accepting those over SMTP in May 2022.
    # Generating one requires 2-Step Verification to be switched on for the account first.
    password: ""
