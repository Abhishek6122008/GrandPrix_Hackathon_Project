# Test overrides. Applied to every @SpringBootTest that does not set its own.
#
# Without this the suite runs against the development state: application.yml points the
# datasource at ./data/crowdflow and the venue store at ./data/venues, so `mvn test` signed
# test accounts into the database a developer is using and left files like
# `api-test-venue.json` and `venue-walker-test.json` sitting in the real venue store. Those
# then load at the next boot and appear in the client portal's venue list as though somebody
# had created them.
#
# Both are redirected under target/, which the build already owns and .gitignore already
# excludes — so a test run is disposable and `mvn clean` genuinely resets it.
#
# Deliberately still a file database rather than jdbc:h2:mem. The suite shares one JVM, and a
# named in-memory database would be shared between test classes just as the file is, so this
# changes where the tests write without changing what they observe. Classes needing true
# isolation ask for their own mem instance by name, as AdminSeedingTest does.
spring.datasource.url=jdbc:h2:file:./target/test-data/crowdflow;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1

crowdflow.venue-store=target/test-data/venues

# Rate limiting off by default across the suite. Nearly every test drives far more requests
# from one loopback address than a person would, so leaving it on means tests fail for being
# tests. RateLimitTest sets it back on for itself, which is the only place it should be
# asserted — see the note in AuthApiTest.
security.rate-limit.enabled=false
