# The PR gate. Runs the same commands as the Jenkinsfile, on GitHub's runners, so a pull request
# carries its own signal instead of needing someone's local Jenkins to be up.
#
# Cheapest-signal-first, same as the Jenkinsfile: the four test jobs run in parallel and fail in
# seconds to a couple of minutes; the docker stack smoke waits behind them rather than spending
# fifteen minutes building images for a commit a unit test already rejected.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push while a run is in flight leaves two runs racing for the same PR's status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp test
        working-directory: backend

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      # pytest is not in requirements.txt — the service genuinely does not need it, and keeping the
      # runtime dependency list honest is worth one line here. The layout extras are installed so
      # the pipeline tests actually run rather than skipping into a false pass.
      - run: pip install -r requirements.txt -r requirements-layout.txt pytest
        working-directory: ai-service
      # `python -m pytest`, not bare `pytest`: the -m form puts the working directory on sys.path,
      # which is how the tests find `app` without a packaging file that exists only for them.
      - run: python -m pytest tests -q
        working-directory: ai-service
      - run: python -m app.scoring
        working-directory: ai-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ci, not install: fails on a lockfile that has drifted from package.json rather than quietly
      # resolving something else.
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:render
        working-directory: frontend
      # The bundle Vite actually ships. Server-rendering every route does not prove it builds.
      - run: npm run build
        working-directory: frontend

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter test
        working-directory: mobile

  stack:
    needs: [backend, ai-service, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      # --wait blocks until every service reports healthy and fails the job if any does not. Each
      # image carries its own HEALTHCHECK, so this proves the containers serve rather than merely
      # start — a Spring app that dies in Flyway still "starts" for several seconds.
      - run: |
          docker compose up -d --wait
          docker compose ps
      # Healthy containers prove each service starts; they do not prove the three still
      # agree. This drives one attendee's journey across all of them — register, upload a
      # venue, run a session, report a position — which is what catches a contract
      # mismatch between services.
      - run: ci/smoke-stack.sh
      - if: failure()
        run: docker compose logs --no-color --tail=300
      - if: always()
        run: docker compose down -v --remove-orphans
