server:
  port: 8080

spring:
  application:
    name: crowd-flow-optimiser

cors:
  # Frontend dev origins allowed to call this API / open the WebSocket.
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

simulation:
  # Wall-clock milliseconds between simulation ticks when a run is live.
  tick-interval-ms: 500
  # Node density (occupancy / capacity) thresholds for alerting.
  warning-threshold: 0.70
  critical-threshold: 0.85
  # How many ticks of history the trend detector looks back over.
  trend-window: 5

hf:
  # Set HF_TOKEN in the environment; leave mock-enabled true until the models are live.
  token: ${HF_TOKEN:}
  mock-enabled: true
  gnn-endpoint: https://api-inference.huggingface.co/models/crowdflow/congestion-gnn
  advisory-endpoint: https://api-inference.huggingface.co/models/crowdflow/advisory-generator
  timeout-ms: 4000

logging:
  level:
    com.crowdflow: DEBUG
