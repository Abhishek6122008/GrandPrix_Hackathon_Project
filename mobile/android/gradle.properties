org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's relocatable incremental cache stores plugin sources as paths relative to the project,
# which throws "this and base files have different roots" when the pub cache and the checkout sit
# on different Windows drives (C:\...\Pub\Cache vs E:\...\mobile). Release builds recompile
# everything anyway, so there is nothing to lose here.
kotlin.incremental=false
