server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # The app routes client-side (/access, /walker, /client, /admin). Without this, a refresh
    # on any route asks nginx for a file that was never built and gets a 404 — the classic SPA
    # deployment bug, and one that only shows up after a reload rather than during navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction: a change produces a new filename, so the
    # cache never needs revalidating. index.html is deliberately excluded — it is what points
    # at the current hashes, and caching it would pin browsers to a stale build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
