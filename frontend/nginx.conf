server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not advertise the exact nginx version. It does not stop anyone determined, but it
    # does keep the container out of trivial "banner matches a known CVE" scans.
    server_tokens off;

    # --- security headers ----------------------------------------------------------------
    # `always` matters: without it nginx omits these on error responses, which are exactly
    # the ones an attacker is trying to provoke.
    #
    # Declared once here and inherited by the location blocks below. Note that an add_header
    # inside a location replaces the whole inherited set rather than adding to it, so any
    # location that sets its own must repeat these — see /assets/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # The app is a Vite bundle talking to the backend and the AI service over XHR/WebSocket.
    # 'unsafe-inline' on style-src is required because the build inlines critical CSS; script
    # is not given the same latitude. connect-src is deliberately broad on scheme rather than
    # host: the API origin is a build argument, so the exact host is not known here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # A floor-plan upload is proxied through to the AI service; anything larger than its own
    # 12MB limit should be refused here rather than after a full round trip.
    client_max_body_size 12m;

    # The app routes client-side (/access, /walker, /client, /admin). Without this, a refresh
    # on any route asks nginx for a file that was never built and gets a 404 — the classic SPA
    # deployment bug, and one that only shows up after a reload rather than during navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction: a change produces a new filename, so the
    # cache never needs revalidating. index.html is deliberately excluded — it is what points
    # at the current hashes, and caching it would pin browsers to a stale build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeated because this block declares its own add_header, which drops everything
        # inherited from the server scope.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
